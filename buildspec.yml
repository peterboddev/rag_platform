version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Checking environment and working directory..."
      - pwd
      - ls -la
      - echo "Checking if package.json exists..."
      - test -f package.json && echo "✅ package.json found" || echo "❌ package.json not found"
      - echo "Node.js version: $(node --version)"
      - echo "NPM version: $(npm --version)"
      - echo "Installing CDK CLI globally..."
      - npm install -g aws-cdk@2.100.0
      - echo "CDK version installed: $(cdk --version)"
      - echo "Installing project dependencies..."
      - npm install
      
  pre_build:
    commands:
      - echo "Pre-build phase started on $(date)"
      - echo "🔐 Validating secure credential access..."
      # Validate that required environment variables are available
      - |
        if [ "$CREDENTIAL_VALIDATION_ENABLED" = "true" ]; then
          echo "📋 Credential validation is enabled"
          
          # Check if CodeConnections connection ARN is available (for connection-based auth)
          if [ -n "$CONNECTION_ARN" ]; then
            echo "✅ CodeConnections connection ARN is configured: $CONNECTION_ARN"
          fi
          
          # Validate AWS credentials
          if aws sts get-caller-identity > /dev/null 2>&1; then
            echo "✅ AWS credentials are valid"
            aws sts get-caller-identity --output text --query 'Arn'
          else
            echo "❌ AWS credentials are invalid"
            exit 1
          fi
          
          echo "✅ All credential validations passed"
        else
          echo "⚠️  Credential validation is disabled"
        fi
      - echo "📋 Validating platform and application configurations..."
      - |
        echo "🔍 Validating platform configuration (cdk.json)..."
        if [ -f "cdk.json" ]; then
          echo "✅ Platform configuration file found"
          # Validate JSON syntax
          if jq empty cdk.json 2>/dev/null; then
            echo "✅ Platform configuration JSON syntax is valid"
          else
            echo "❌ Platform configuration JSON syntax is invalid"
            exit 1
          fi
        else
          echo "❌ Platform configuration file (cdk.json) not found"
          exit 1
        fi
        
        echo "🔍 Validating application configurations..."
        if [ -d "config/applications" ]; then
          echo "✅ Application configuration directory found"
          # Validate each application configuration file
          for config_file in config/applications/*.json; do
            if [ -f "$config_file" ]; then
              echo "🔍 Validating $(basename "$config_file")..."
              if jq empty "$config_file" 2>/dev/null; then
                echo "✅ $(basename "$config_file") JSON syntax is valid"
                # Check for required application fields
                if jq -e '.applicationName and .team and .sourceRepo and .deploymentTargets' "$config_file" >/dev/null 2>&1; then
                  echo "✅ $(basename "$config_file") has required fields"
                else
                  echo "❌ $(basename "$config_file") missing required fields"
                  exit 1
                fi
              else
                echo "❌ $(basename "$config_file") JSON syntax is invalid"
                exit 1
              fi
            fi
          done
        else
          echo "⚠️  No application configuration directory found (config/applications)"
        fi
        
        echo "✅ Configuration validation completed successfully"
      - echo "Installing project dependencies..."
      - npm install
      - echo "Validating TypeScript configuration..."
      - npx tsc --noEmit --skipLibCheck
      - echo "Compiling TypeScript..."
      - npm run build
      - echo "Running configuration validation script..."
      - npx ts-node scripts/validate-deployment.ts --mode configuration --verbose
      - echo "Running tests..."
      - npm test
      
  build:
    commands:
      - echo "Build phase started on $(date)"
      - echo "Compiling TypeScript..."
      - npm run build
      - echo "Running tests..."
      - npm test
      - echo "Synthesizing CDK templates..."
      - npx cdk synth
      
  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Deployment successful"
      # Log credential usage for audit purposes (without exposing sensitive data)
      - |
        if [ "$CREDENTIAL_VALIDATION_ENABLED" = "true" ]; then
          echo "📊 Credential usage audit:"
          echo "  - GitHub authentication method: CodeConnections Connection"
          echo "  - AWS identity: $(aws sts get-caller-identity --output text --query 'Arn' 2>/dev/null || echo "Unknown")"
          echo "  - Secrets prefix: ${SECRETS_PREFIX:-"Not configured"}"
        fi

cache:
  paths:
    - 'node_modules/**/*'
    - '/root/.npm/**/*'
    - '/usr/local/lib/node_modules/**/*'

artifacts:
  base-directory: 'cdk.out'
  files:
    - '**/*'

env:
  variables:
    NODE_ENV: production
    CDK_NEW_BOOTSTRAP: 1
    CDK_DISABLE_VERSION_CHECK: 1
    # Credential validation is enabled by default for security
    CREDENTIAL_VALIDATION_ENABLED: true
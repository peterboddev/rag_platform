# Example buildspec.yml for SAM Applications
# Place this file at the root of your application repository
# 
# This buildspec has been tested and works with the RAG platform pipeline
# Last updated: 2026-03-09

version: 0.2

# Environment variables (optional)
# CRITICAL: Do NOT set NODE_ENV=production - it breaks devDependencies installation
env:
  variables:
    # Add your custom environment variables here
    # SAM_CLI_TELEMETRY: 0  # Disable SAM CLI telemetry (optional)
  
  # Parameter store values (optional)
  # parameter-store:
  #   DATABASE_URL: /myapp/database/url

phases:
  install:
    # Specify runtime versions
    runtime-versions:
      nodejs: 20    # Use Node.js 20 (compatible with npm 11+)
      python: 3.11  # Python for SAM CLI
    
    commands:
      - echo "Installing SAM CLI..."
      - pip install aws-sam-cli
      - echo "SAM CLI version: $(sam --version)"
      - echo "Node.js version: $(node --version)"
      - echo "NPM version: $(npm --version)"

  pre_build:
    commands:
      - echo "Running pre-build checks..."
      - echo "Installing dependencies..."
      - npm ci  # Install Node.js dependencies
      - echo "Running tests..."
      - npm run test  # Run your test suite

  build:
    commands:
      - echo "Building SAM application..."
      - sam build  # Build SAM application
      - echo "Packaging SAM application..."
      - sam package --output-template-file packaged.yaml --s3-bucket $ARTIFACT_BUCKET || echo "Package step skipped - will be handled by pipeline"
      - echo "Listing generated artifacts..."
      - ls -la template.yaml

  post_build:
    commands:
      - echo "Build completed successfully on $(date)"
      - echo "Artifacts ready for deployment"

# Artifacts configuration
artifacts:
  files:
    - template.yaml      # SAM template
    - packaged.yaml      # Packaged template (if sam package was run)
    - '**/*.js'          # Include Lambda function code
    - '**/*.py'          # Include Python Lambda functions
    - '**/*.json'        # Include configuration files
  exclude-paths:
    - node_modules/**/*  # Exclude node_modules from artifacts
    - .git/**/*          # Exclude git directory
    - tests/**/*         # Exclude test files

# Cache configuration (speeds up builds)
cache:
  paths:
    - 'node_modules/**/*'  # Cache npm dependencies
    - '.aws-sam/**/*'      # Cache SAM build artifacts

# Reports (optional - for test results and code coverage)
# reports:
#   jest_reports:
#     files:
#       - 'coverage/clover.xml'
#     file-format: 'CLOVERXML'
